apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghost-qa
  namespace: ghost-qa
  annotations:
    # nginx ingress controller; adjust class for your cluster
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ghost-qa.example.com
      secretName: ghost-qa-tls
  rules:
    - host: ghost-qa.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ghost-qa
                port:
                  number: 80
