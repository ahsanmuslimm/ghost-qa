# TEMPLATE ONLY — do not commit real values.
# Create the real secret out-of-band, e.g.:
#
#   kubectl -n ghost-qa create secret generic ghost-qa-secrets \
#     --from-literal=DATABASE_URL='postgresql://ghost_qa:PASS@pg-host:5432/ghost_qa' \
#     --from-literal=SECRET_KEY='$(openssl rand -hex 32)' \
#     --from-literal=GITHUB_TOKEN='ghp_xxx' \
#     --from-literal=GITHUB_WEBHOOK_SECRET='whsec_xxx' \
#     --from-literal=GEMINI_API_KEY='xxx' \
#     --from-literal=UIPATH_CLIENT_ID='xxx' \
#     --from-literal=UIPATH_CLIENT_SECRET='xxx' \
#     --from-literal=SLACK_BOT_TOKEN='xoxb-xxx'
#
apiVersion: v1
kind: Secret
metadata:
  name: ghost-qa-secrets
  namespace: ghost-qa
type: Opaque
stringData:
  DATABASE_URL: CHANGE_ME
  SECRET_KEY: CHANGE_ME
  GITHUB_TOKEN: CHANGE_ME
  GITHUB_WEBHOOK_SECRET: CHANGE_ME
  GEMINI_API_KEY: CHANGE_ME
  ANTHROPIC_API_KEY: ""
  XAI_API_KEY: ""
  UIPATH_CLIENT_ID: CHANGE_ME
  UIPATH_CLIENT_SECRET: CHANGE_ME
  UIPATH_TENANT_NAME: CHANGE_ME
  UIPATH_ORG_ID: CHANGE_ME
  UIPATH_ENVIRONMENT_ID: CHANGE_ME
  SLACK_BOT_TOKEN: ""
