apiVersion: v1
kind: ConfigMap
metadata:
  name: ghost-qa-config
  namespace: ghost-qa
data:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_PORT: "8000"
  AI_PROVIDER: auto
  GEMINI_MODEL: gemini-2.5-flash
  AUTO_APPROVE: "false"
  CORS_ORIGINS: https://ghost-qa.example.com
  RATE_LIMIT_ENABLED: "true"
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "10"
  DATABASE_POOL_RECYCLE: "3600"
  DATABASE_POOL_PRE_PING: "true"
