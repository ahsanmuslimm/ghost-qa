global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ghost-qa
    metrics_path: /metrics
    static_configs:
      - targets: ["ghost-qa:8000"]
        labels:
          service: ghost-qa
          env: production

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
