name: Docker Build & Publish

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ghost-qa-backend:${{ github.sha }} .

      - name: Smoke-test container health endpoint
        run: |
          docker run -d --name ghostqa -e DEMO_MODE=true -e DATABASE_URL=sqlite:///./demo.db -p 8000:8000 ghost-qa-backend:${{ github.sha }}
          sleep 10
          curl -fsS http://localhost:8000/

      # Pushes only run on main/tags and only when GHCR credentials exist
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/ghost-qa-backend
          docker tag ghost-qa-backend:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker push $IMAGE:${{ github.sha }}

  frontend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t ghost-qa-frontend:${{ github.sha }} ./frontend
