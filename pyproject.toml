[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ghost-qa"
version = "1.0.0"
description = "AI-powered QA engineer for CI/CD pipelines"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.3",
    "python-dotenv==1.0.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "anthropic==0.39.0",
    "google-genai>=1.5.0",
    "requests==2.32.3",
    "python-multipart==0.0.18",
    "pyjwt==2.9.0",
    "cryptography==43.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==7.1.0",
    "httpx>=0.28.1,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "performance: performance/load tests with timing thresholds",
    "e2e: end-to-end tests driving full flows over the HTTP API",
]
